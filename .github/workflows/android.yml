# Builds the LUVYO Android app on every push to main (and on demand).
# - Always: a debug APK you can install on a phone (Actions run → Artifacts → luvyo-debug-apk).
# - If signing secrets are set: a signed release bundle (.aab) for the Play Store.
#   Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # publish the latest APK to the android-builds branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:          # for the database tests (tests/pg.test.js)
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test engines, API and database
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm test

      # Set the repository variable LUVYO_API_BASE (Settings → Secrets and variables → Actions →
      # Variables) to your server, e.g. https://luvyo-api.onrender.com, to build the connected app.
      # Without it the APK is the standalone demo.
      - name: Build web app and copy it into the Android project
        env:
          LUVYO_API_BASE: ${{ vars.LUVYO_API_BASE }}
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: luvyo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Phone-friendly download: https://github.com/<owner>/<repo>/raw/android-builds/LUVYO-debug.apk
      # The branch holds only the newest APK (replaced on every build, no history kept).
      - name: Publish APK to the android-builds branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/apk" && cd "$RUNNER_TEMP/apk"
          cp "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk" LUVYO-debug.apk
          printf 'LUVYO debug APK\n\nBuilt from %s on %s.\nDownload: https://github.com/%s/raw/android-builds/LUVYO-debug.apk\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%MZ)" "$GITHUB_REPOSITORY" > README.md
          git init -q -b android-builds
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Debug APK for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" android-builds

      - name: Build signed release bundle (only when signing secrets exist)
        if: ${{ env.KEYSTORE != '' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/upload.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          ./gradlew bundleRelease --no-daemon
          rm -f keystore.properties "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != '' }}
        with:
          name: luvyo-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
