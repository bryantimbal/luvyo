<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176B45">
  <meta name="application-name" content="LUVYO">
  <meta name="apple-mobile-web-app-title" content="LUVYO">
  <meta name="description" content="LUVYO – compare jeepney, bus, train, tricycle, motorcycle taxi and ride-hailing routes with estimated fares and travel times.">
  <title>LUVYO – Philippine Mobility App</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./styles.css">
  <script src="./vendor/leaflet/leaflet.js" defer></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="./icons/icon.svg" alt="" width="96" height="96">
    <div class="splash-name">LUVYO</div>
    <div class="splash-sub">Philippine Mobility App</div>
    <div class="splash-tag">Mas Mabilis Magplano. Mas Tipid Magbiyahe.</div>
  </div>
  <div id="offline-banner" role="status" hidden></div>
  <main id="view" class="view" tabindex="-1"></main>
  <nav id="bottom-nav" aria-label="Main"></nav>
  <div id="toasts" aria-live="polite"></div>
  <noscript>LUVYO needs JavaScript to plan routes.</noscript>
</body>
</html>
